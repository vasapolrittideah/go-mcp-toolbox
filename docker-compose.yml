services:
  mysql:
    image: mysql:9.7
    container_name: toolbox-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: toolbox_db
      MYSQL_USER: toolbox_user
      MYSQL_PASSWORD: my-password
      MYSQL_ROOT_PASSWORD: my-root-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Executed in alphabetical order on first startup only (empty data dir).
      # Each file gets its own session, so each one opens with SET NAMES utf8mb4
      # to keep the client from double-encoding the Thai text.
      - ./toolbox/food_schema.sql:/docker-entrypoint-initdb.d/01_food_schema.sql:ro
      - ./toolbox/food_seed.sql:/docker-entrypoint-initdb.d/02_food_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u toolbox_user -pmy-password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
